[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese-caption-assistant"
version = "0.3.0"
description = "Kitori: real-time Japanese subtitles and live captions with furigana for desktop audio"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["japanese", "japanese-learning", "furigana", "real-time-captions", "japanese-subtitles", "speech-recognition", "desktop"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["requests>=2.32,<3", "SudachiPy>=0.6,<0.7", "SudachiDict-small>=20240109", "PySide6>=6.8,<7", "QtAwesome>=1.4,<2"]

[project.optional-dependencies]
reazon = ["sherpa-onnx==1.13.3", "numpy>=2,<3"]
dev = ["build>=1,<2", "numpy>=2,<3"]

[tool.setuptools]
include-package-data = false
packages = ["jcaption"]
py-modules = ["caption_bridge"]

[tool.setuptools.package-data]
jcaption = ["web/*.html", "web/*.js", "web/*.css", "model_catalog.json", "local_model_catalog.json", "ui_translations.json"]
